<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <body>
        <div id="container">
            <button data-action="gm">GOOD MORNING</button>
            <button data-action="Hi">HI</button>
            <button data-action="hello">HLO</button>
            <button data-action="Jay">JI</button>
            <button data-action="Bie">BYE</button>
        </div>
        <script>

            const parent = document.getElementById("container");

            parent.addEventListener("click" , (event)=>{
                const btn = event.target.closest("button");   // CLOSEST ISLIYE LGYA H TAKI AGAR BUTTON KE ANDAR SPAN BHI HOGA TO VO BHI TARGET HOGA
                if (!btn || !parent.contains(btn))
                return;

                const action = btn.dataset.action ;
                alert(action);

                switch(action){
                    case 'gm':alert("GOOD MORNING"); break;
                    case 'Hi':alert("GOOD NIGHT"); break;
                    case 'hello':alert("GOOD EVENING"); break;
                    case 'Jay':alert("HELLO"); break;
                    case 'Bie':alert("BYE-BYE"); break;
                }
            })
            // NORMAL DELEGATION

            //         alert("BUTTON IS CALLED")
            //     })
            // })

            // const btn01 = document.getElementById("btn01");
            // btn01.addEventListener("click" , ()=>{
            //     alert("BUTTON 1 IS CLICKED")
            // })
        </script>
    </body>
</body>
</html>

  <body>
    <script>
      const getpromise = () => {
        return new Promise((resolve, reject) => {
          console.log("RADHE RADHE");
          resolve("success");
        });
      };

      let promise = getpromise();
      promise.then(() => {
        console.log("promise fullfilled");
      });
    </script>

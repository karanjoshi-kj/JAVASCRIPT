<!--!  GENERALLY WE DO NOT GENERATE THE PROMISES , IF WE REQUEST AN API FOR A PATICULAR DATA THEN IT WILL SEND PROMISE TO US & WE ONLY HAVE TO HANDLE IT .  -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROMISES</title>
  </head>
  <body>
    <script>
      <!--!   HERE (Promise)  IS THE CLASS AND RESOLVE & REJECT ARE THE FUNCTIONS WHICH ARE DEFINED BY THE JS. -->
      let promise = new Promise((resolve, reject) => {
        console.log("I AM A PROMISE"); // THIS WILL GO TO THE PENDING STATE AND RESULT IS UNDEFINED .
        resolve(123); // NOW THE PROMISE STATE IS FULLFILLED AND THE RESULT IS 123 .
        resolve("hello"); // THE PROMISE STATE CAN ALSO BE A STRING .
        reject("SOME ERROR OCCURED"); // IT WILL GENERATE AN ERROR MESSAGE AND THE STATE IS REJECTED .
      });
    </script>
  </body>
</html>

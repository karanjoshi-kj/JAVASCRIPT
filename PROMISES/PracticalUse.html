<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROMISES</title>
  </head>
  <body>
    <script>
      <!--! BASIC EXAMPLE :  -->
      function getdata(dataID, nextdata) {
        // LET SAY getdata IS AN API WHICH WILL GIVE US THE DATA ACCORDING TO OUR DEMAND .
        return new Promise((resolve, reject) => {
          // THE API WILL RETURN THE PROMISE (WHOSE STATE WILL BE PENDING AT THE INITIAL TIME) , TO THE USER THAT IT WILL PROVIDE THE DATA .
          setTimeout(() => {
            console.log("data", dataID);
            resolve("SUCCESS"); // IF DATA HAS BEEN RETURNED SUCCESFULLY THEN WE USE THE RESOLVE FUNCTION .
            if (nextdata) {
              nextdata();
            }
          }, 10000); // YHA PAR YE DATA 10 SECOND BAAD M DEGA LEKIN PROMISE TURANT DEGA KI HAA M APKO DATA DUGA , LEKIN 10 SECOND KE BAAD 😂😂.
        });
      }
    </script>
  </body>
</html>

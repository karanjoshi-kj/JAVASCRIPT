<!--! ASYNCHRONOUS MEANS :  -->
<!--? SOME TASK RUNNING IN THE BACKGROUND . -->
<!--? JS DOES NOT WAIT . -->
<!--? IT CONTINUES EXECUTING NEXT LINES . -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        async function greet(){
            <!--! NORMALLY ASYCN METHOD WORKS AS THE SYNCHRONOUS METHOD , TO WORK IT LIKE THE ASYCN FUNCTION IT USES AWAIT METHOD .  -->
            console.log("HELLO SIR !!");
            setTimeout(()=>{
                console.log("ASYNCH METHOD");
            } , 2000);
            console.log("OUTSIDE THE SETTIMIEOUT METHOD");
        }
        greet();
    </script>
</body>
</html>

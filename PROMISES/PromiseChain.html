<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMISE CHAIN</title>
</head>
<body>
    <script>
        function async(){
            return new Promise((resolve , reject) => {
                setTimeout(()=>{
                    console.log("DATA 1");
                    resolve("SUCCESS");
                },4000);
            });
        }

        let p1 = async();
        p1.then((res)=>{
            console.log(res);
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="fruitinput" placeholder="Enter Fruit Name">
    <button onclick="getvalue()">ADD</button>
    <ul  id="fruitlist"></ul>
    <script>
        function addelementtolist(fruitname){
            const li = document.createElement("li")
            li.innerHTML = `${fruitname}`;
            document.getElementById("fruitlist").appendChild(li)
        }
        
        function getvalue(){
        addelementtolist(document.getElementById('fruitinput').value)
        }
    </script>
</body>
</html>

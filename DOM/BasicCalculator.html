<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <h1 id="calci">Calculator</h1>

    Enter Number 1 :
    <input type="text" id="input1" /><br />

    Enter Number 2 :
    <input type="text" id="input2" /><br />

    <button onclick="Calculate('add')">ADD</button>
    <button onclick="Calculate('sub')">SUB</button>
    <button onclick="Calculate('mul')">MUL</button>
    <button onclick="Calculate('div')">DIV</button>

    <p id="OUTPUT"></p>
    <script>
      function Calculate(operation) {
        console.log(operation);
        const num1 = Number(document.getElementById("input1").value);
        const num2 = Number(document.getElementById("input2").value);

        let result = "";

        if (!num1 || !num2) return OUTPUT.innerHTML = "ERROR";
        else {
          if (operation === "add") {
            result = "Addition :" + (num1 + num2);
            console.log(result);
          } else if (operation === "mul") {
            result = "Multiplication :" + num1 * num2;
            console.log(result);
          } else if (operation === "sub") {
            result = "Subtraction :" + (num1 - num2);
            console.log(result);
          } else if (operation === "div") {
            result = "Division :" + num1 / num2;
          } else {
            console.log("PLZZ ENTER THE VALID INPUT");
          }
          document.getElementById("OUTPUT").innerHTML = result;
        }
      }
    </script>
  </body>
</html>

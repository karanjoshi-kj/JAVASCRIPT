<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <h1>Calculator</h1>

    Enter Number 1 :
    <input type="number" id="input1" /><br />

    Enter Number 2 :
    <input type="number" id="input2" /><br />

    <button onclick="Calculate('add')">ADD</button>
    <button onclick="Calculate('sub')">SUB</button>
    <button onclick="Calculate('mul')">MUL</button>
    <button onclick="Calculate('div')">DIV</button>

    <script>
      function Calculate(operation) {
        const num1 = document.getElementById("input1").value;
        const num2 = document.getElementById("input2").value;
        let result = "";

        if (operation === "add"){ 
        result = "Addition :" + (num1 + num2);
        }
        else if (operation === "mul"){ 
        result = "Multiplication :" + num1 * num2;
        }
        else if (operation === "sub"){ 
        result = "Subtraction :" + (num1 - num2);
        }
        else operation === "div";{
        result = "Division :" + num1 / num2;
        }
        document.getElementById("OUTPUT").innerText = result;
      }
    </script>
  </body>
</html>

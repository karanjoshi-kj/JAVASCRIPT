<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="box"></div>
    <script>
        async function getdata(){
            try{
                const api = await fetch("https://dummyjson.com/products");
                const data = await api.json();
                const products = data.products;
                const box = document.getElementById("box");
<!--! LINE 16 KA LOGIC : -->
// SAASE PAHLE RIGHT SIDE M DOCUMEMT M JAYEGA JISKA ID BOX HAI US ELEMENT KO MUJHE DE DEDO FRR AB BAAT AAYI LEFT SIDE KI YE USS HTML KO EK VARIABLE M STORE KAR DEGA AB BOX KE ANDAR LINE NUMBER 9 PURA AA GYA . 
                for(let i = 0 ; i < products.length ; i++){
                    const p = document.createElement("p");
                    p.innerText = products[i].title;
                    box.appendChild(p); // MTLB USS DIV KE ANDAR NAYA ELEMENT ADD KAR DIYA BSS 
                }
            }
            catch(e){
                console.log("ERROR :" , e)
            }
        }
        getdata();
    </script>
</body>
</html>

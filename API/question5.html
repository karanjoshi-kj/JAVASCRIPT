<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="alldata"></div>
    <script>
      const container = document.getElementById("alldata");
      async function getdata(){
        try {
          const api = await fetch(
            "https://fakestoreapiserver.reactbd.org/api/users",
          );
          const userdata = await api.json();
          container.innerHTML = userdata.data.map(   // MAP FUNCTION ITERATES ONLY ON ARRAY & HERE DATA IS GIVEN IN THE FORM OF (ARRAY OF OBJECT) . 
            user => `${user.name}`
          )
        } catch (e) {
          console.log("ERROR : ", e);
        }
      }
      getdata();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function Memosq(){
            let cache = {};   // YHA EK KHALI OBJECT BNA RE H ISKE ANDAR RESULT STORE HOGA 
            
            return function(n){
                if (n in cache) {
                    console.log("RESULT PAHLE SE H.." , n);
                    return cache[n];
                }
                else{
                    console.log("CALCULATE SQUARE" , n);
                    let result = n*n;
                    cache[n] = result;
                    return result;
                }
            };
        }
        const square = Memosq();

        console.log(square(5));
        console.log(square(5));
        console.log(square(5));
        console.log(square(3));
        console.log(square(3));
        console.log(square(4));
        
    </script>
</body>
</html>

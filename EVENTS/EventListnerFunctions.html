<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="hell"></p>
    <script>
      let stop = 5;
      const paraa = document.getElementById("hell");
      const aa = setInterval(() => {
        paraa.innerHTML = `Closing it in ${stop} Seconds....`;
        stop--;
        if (stop == 0) {
          clearInterval(aa);
        }
      }, 2000);
    </script>
  </body>
</html>

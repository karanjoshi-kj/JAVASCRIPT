<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Event Listeneres</title>
  </head>
  <body>
    <p>hello</p>
    <script>
        
       
        <!-- IF WE WANT TO CHECK THAT WHICH KEY HAS BEEN PRESSED , THEN -->
        document.addEventListener("keydown",(e)=>{
            alert(`IDENTIFY WHICH HAS BEEN PRESSED , ${e.key}`);
        })
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Event Listeneres</title>
  </head>
  <body>
    <p>hello</p>
    <script>
        document.addEventListener("keydown",()=>{
            alert("KEY DOWN");
        }) 
        document.addEventListener("keyup",()=>{
            alert("KEY UP");
        })
        document.addEventListener("keypress",()=>{
            alert("KEY PRESS");
        })

        <!-- IF WE WANT TO CHECK THAT WHICH KEY HAS BEEN PRESSED , THEN -->
        document.addEventListener("keydown",(e)=>{
            alert(`IDENTIFY WHICH HAS BEEN PRESSED , ${e.key}`);
        })
        
        // IT WILL ALSO TELL THAT KEY IS PRESSED FORM WHERE
        document.addEventListener("keydown",(e)=>{
            alert(`IDENTIFY WHICH HAS BEEN PRESSED , ${e.code}`);
        })

        document.addEventListener("keydown",(e)=>{
            if(e.key==="Enter"){
                alert("Enter Key is preesed")
            }
            else{
                alert("invalid")
            }
        })
    </script>
  </body>
</html>
